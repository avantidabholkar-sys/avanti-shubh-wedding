name: Enable GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/enable-pages.yml"]
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from the main branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "POST $code"
          cat /tmp/pages.json
          echo
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          # 422 can mean the site already exists; confirm with GET.
          if [ "$code" = "422" ]; then
            get=$(curl -sS -o /tmp/pages-get.json -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages)
            echo "GET $get"
            cat /tmp/pages-get.json
            echo
            [ "$get" = "200" ] && exit 0
          fi
          exit 1
